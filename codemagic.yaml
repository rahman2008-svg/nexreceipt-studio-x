workflows:
  android-build:
    name: NexReceipt Studio X Build
    max_build_duration: 60

    environment:
      java: 17

      vars:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    scripts:

      - name: Checkout info
        script: ls -la

      - name: Fix missing env files (Secrets plugin)
        script: |
          touch .env
          touch .env.example
          echo "# Codemagic placeholder env" > .env.example

      - name: Fix Gradle permissions
        script: chmod +x gradlew

      - name: Verify Gradle Wrapper
        script: ./gradlew --version

      - name: Clean project
        script: ./gradlew clean

      - name: Build Debug APK
        script: ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - your-email@example.com
