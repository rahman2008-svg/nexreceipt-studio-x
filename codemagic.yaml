workflows:
  android-build:
    name: NexReceipt Build
    max_build_duration: 60

    environment:
      java: 17

      vars:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    scripts:
      - name: Check files
        script: ls -la

      - name: Fix env files
        script: |
          touch .env
          touch .env.example

      - name: Make gradlew executable
        script: chmod +x gradlew

      - name: Verify Gradle
        script: ./gradlew --version

      - name: Clean build
        script: ./gradlew clean

      - name: Build APK
        script: ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/**/*.apk
